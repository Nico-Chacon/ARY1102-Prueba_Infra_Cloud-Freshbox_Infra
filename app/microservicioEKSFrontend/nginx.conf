# FreshBox SpA - Nginx (frontend + reverse proxy hacia los microservicios)
# El ALB Ingress entrega TODO el trafico al frontend (puerto 80, segun la tabla
# de Security Groups del enunciado). Nginx enruta /api/products por metodo HTTP
# hacia el Service ClusterIP correspondiente:
#   GET    /api/products        -> get-products:3001
#   GET    /api/products/:id    -> get-products:3001
#   POST   /api/products        -> create-product:3002
#   PUT    /api/products/:id    -> update-product:3003
#   DELETE /api/products/:id    -> delete-product:3004
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health check del ALB / probes de Kubernetes
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Coleccion de productos
    location = /api/products {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        if ($request_method = POST) {
            proxy_pass http://create-product:3002;
        }
        proxy_pass http://get-products:3001;
    }

    # Producto individual (/api/products/<id>)
    location ~ ^/api/products/[0-9]+$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        if ($request_method = PUT) {
            proxy_pass http://update-product:3003;
        }
        if ($request_method = DELETE) {
            proxy_pass http://delete-product:3004;
        }
        proxy_pass http://get-products:3001;
    }

    # Contenido estatico
    location / {
        try_files $uri $uri/ /index.html;
    }
}
