apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: freshbox-ingress
  namespace: freshbox
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: freshbox-chacon-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # SG de la capa publica creado por Terraform (80/443 desde 0.0.0.0/0)
    alb.ingress.kubernetes.io/security-groups: ${ALB_SG_ID}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/tags: Project=freshbox-chacon,Environment=dev,CostCenter=ecommerce-chacon,ManagedBy=kubernetes,Course=ARY1102-EP2,Student=chacon
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
